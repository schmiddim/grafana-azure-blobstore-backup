# Build and publish Docker image to GitHub Container Registry
#
# Triggered by version tags (v*.*.*) created by:
#   - dependabot-docker.yml  (Patch bump: v1.0.X  on Dockerfile dependency updates)
#   - update-gcx.yml  (Minor bump: v1.X.0  on gcx updates)
#   - initial-release.yml    (v1.0.0 bootstrap)
#
# Publishes to: ghcr.io/schmiddim/grafana-azure-blobstore-backup
# No additional secrets required - GITHUB_TOKEN covers GHCR and releases.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write   # Create GitHub Releases
  packages: write   # Push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/schmiddim/grafana-azure-blobstore-backup:${{ steps.version.outputs.tag }}
            ghcr.io/schmiddim/grafana-azure-blobstore-backup:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Docker Image

            ```
            docker pull ghcr.io/schmiddim/grafana-azure-blobstore-backup:${{ steps.version.outputs.tag }}
            ```
