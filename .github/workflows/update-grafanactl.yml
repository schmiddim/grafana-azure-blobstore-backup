# Automatic grafanactl version updates with minor-version release
#
# This workflow:
# 1. Checks weekly for new grafanactl releases
# 2. Updates the Dockerfile ARG if a new version is available
# 3. Commits directly to main
# 4. Bumps the minor version and pushes a Git tag → triggers release.yml
#
# Version bumping:
#   grafanactl update → Minor bump: v1.X.0  (patch resets to 0)
#
# No additional secrets required beyond GITHUB_TOKEN.

name: Update grafanactl

on:
  schedule:
    - cron: '0 5 * * 1'  # Mondays 05:00 UTC (before Dependabot at 06:00)
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  update-grafanactl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to read all tags

      - name: Get latest grafanactl version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --repo grafana/grafanactl --json tagName -q .tagName)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest grafanactl version: $LATEST"

      - name: Get current version from Dockerfile
        id: current
        run: |
          CURRENT=$(grep "^ARG GRAFANACTL_VERSION=" Dockerfile | cut -d= -f2)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current grafanactl version: $CURRENT"

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.latest.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sed -i "s/^ARG GRAFANACTL_VERSION=.*/ARG GRAFANACTL_VERSION=${{ steps.latest.outputs.version }}/" Dockerfile
          echo "Updated Dockerfile:"
          grep "ARG GRAFANACTL_VERSION" Dockerfile

      - name: Commit changes
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore(deps): update grafanactl to ${{ steps.latest.outputs.version }}"
          git push

      - name: Bump minor version and push tag
        if: steps.check.outputs.needs_update == 'true'
        id: bump
        run: |
          # Re-fetch tags after the commit push
          git fetch --tags

          # Get latest semver tag (default v0.0.0 if none exists)
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)

          NEW_MINOR=$((MINOR + 1))
          NEW_TAG="v${MAJOR}.${NEW_MINOR}.0"
          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          git tag "$NEW_TAG"
          # Use GH_PAT so the tag push triggers release.yml
          # (GITHUB_TOKEN pushes do not trigger subsequent workflow runs)
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" "$NEW_TAG"

      - name: Summary
        run: |
          echo "## grafanactl Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous | \`${{ steps.current.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | \`${{ steps.latest.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.needs_update }}" == "true" ]; then
            echo "**Status:** Updated and committed to main." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Release tag:** \`${{ steps.bump.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "release.yml will build and push \`ghcr.io/schmiddim/grafana-azure-blobstore-backup:${{ steps.bump.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Already up to date. No changes made." >> $GITHUB_STEP_SUMMARY
          fi
