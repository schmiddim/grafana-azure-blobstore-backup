# Auto-merge Dependabot PRs and trigger a patch-version release
#
# This workflow:
# 1. Auto-approves and merges Dependabot PRs (skips workflow file changes)
# 2. After a Dockerfile change is merged to main: bumps the patch version,
#    pushes a new Git tag → triggers release.yml to build & push to GHCR
#
# Version bumping:
#   Dependabot (base image updates) → Patch bump: v1.0.X
#
# No additional secrets required beyond GITHUB_TOKEN.

name: Dependabot Auto-Merge & Patch Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  # ==========================================================================
  # Job 1: Auto-merge Dependabot PRs (skip workflow file changes)
  # ==========================================================================
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if PR contains workflow changes
        id: check-workflows
        run: |
          FILES=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files -q '.files[].path')
          if echo "$FILES" | grep -q "^\.github/workflows/"; then
            echo "has_workflow_changes=true" >> $GITHUB_OUTPUT
            echo "PR contains workflow changes - skipping auto-merge"
          else
            echo "has_workflow_changes=false" >> $GITHUB_OUTPUT
            echo "No workflow changes - proceeding with auto-merge"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependabot metadata
        if: steps.check-workflows.outputs.has_workflow_changes == 'false'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve Dependabot PR
        if: steps.check-workflows.outputs.has_workflow_changes == 'false'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PR
        if: steps.check-workflows.outputs.has_workflow_changes == 'false'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip notice for workflow PRs
        if: steps.check-workflows.outputs.has_workflow_changes == 'true'
        run: |
          echo "## Skipped Auto-Merge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This PR contains workflow file changes and requires manual review." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 2: Bump patch version and push tag after Dockerfile merge
  # ==========================================================================
  patch-release:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required to read all tags

      - name: Bump patch version and push tag
        id: bump
        run: |
          # Get latest semver tag (default v0.0.0 if none exists)
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          echo "Latest tag: $LATEST"

          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          # Use GH_PAT so the tag push triggers release.yml
          # (GITHUB_TOKEN pushes do not trigger subsequent workflow runs)
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" "$NEW_TAG"

      - name: Summary
        run: |
          echo "## Patch Release Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**New tag:** \`${{ steps.bump.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "release.yml will build and push \`ghcr.io/schmiddim/grafana-azure-blobstore-backup:${{ steps.bump.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY
